name: Build ArabicOffice IPA (armv7)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Theos and Toolchain
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            ~/theos
            /usr/local/bin
            /usr/local/lib
            /usr/local/include
            /usr/local/share
          key: ios9-armv7-theos-toolchain-v12

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential clang clang-12 llvm llvm-12-dev lld \
            cmake ninja-build pkg-config \
            git curl ca-certificates unzip zip python3 \
            libxml2-dev libssl-dev zlib1g-dev uuid-dev \
            libbz2-dev liblzma-dev libblocksruntime-dev libdispatch-dev libplist-dev \
            fakeroot dpkg

      - name: Build ldid, libtapi, and cctools (armv7)
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p /tmp/toolchain-build
          cd /tmp/toolchain-build

          git clone --depth 1 https://github.com/tpoechtrager/ldid.git
          make -C ldid CXX=clang++-12 INSTALLPREFIX=/usr/local -j$(nproc) install

          git clone --depth 1 https://github.com/tpoechtrager/apple-libtapi.git
          cd apple-libtapi
          CC=clang-12 CXX=clang++-12 INSTALLPREFIX=/usr/local ./build.sh
          ./install.sh
          cd /tmp/toolchain-build

          git clone --depth 1 https://github.com/tpoechtrager/cctools-port.git
          cd cctools-port/cctools
          python3 - << 'EOF'
          import glob, re

          FUNCS = (
              "dispatch_apply",
              "dispatch_sync",
              "dispatch_async",
              "dispatch_barrier_sync",
              "dispatch_barrier_async",
              "dispatch_group_async",
              "dispatch_once",
          )
          PATTERN = re.compile(r'\b(' + '|'.join(FUNCS) + r')\s*\(')

          def patch_gcd(s):
              pos = 0
              while True:
                  m = PATTERN.search(s, pos)
                  if not m:
                      break
                  func = m.group(1)
                  open_paren = m.end() - 1
                  p_depth = 0
                  b_depth = 0
                  in_str = None
                  in_line_comment = False
                  in_block_comment = False
                  i = open_paren
                  args = []
                  arg_start = open_paren + 1
                  end_paren = -1

                  while i < len(s):
                      c = s[i]
                      nxt = s[i + 1] if i + 1 < len(s) else ''
                      if in_line_comment:
                          if c == '\n':
                              in_line_comment = False
                      elif in_block_comment:
                          if c == '*' and nxt == '/':
                              in_block_comment = False
                              i += 1
                      elif in_str:
                          if c == '\\':
                              i += 1
                          elif c == in_str:
                              in_str = None
                      else:
                          if c == '/' and nxt == '/':
                              in_line_comment = True
                              i += 1
                          elif c == '/' and nxt == '*':
                              in_block_comment = True
                              i += 1
                          elif c in ('"', "'"):
                              in_str = c
                          elif c == '(' and b_depth == 0:
                              p_depth += 1
                          elif c == ')' and b_depth == 0:
                              p_depth -= 1
                              if p_depth == 0:
                                  args.append(s[arg_start:i])
                                  end_paren = i
                                  break
                          elif c == '{':
                              b_depth += 1
                          elif c == '}':
                              b_depth -= 1
                          elif c == ',' and p_depth == 1 and b_depth == 0:
                              args.append(s[arg_start:i])
                              arg_start = i + 1
                      i += 1

                  if end_paren != -1 and len(args) >= 2 and args[-1].lstrip().startswith('^'):
                      args = [patch_gcd(a) for a in args]
                      last = args[-1]
                      stripped = last.lstrip()
                      lead = last[:len(last) - len(stripped)]
                      lam = lead + '[&]' + stripped[1:]

                      if func == "dispatch_apply" and len(args) == 3:
                          rep = f"([&](size_t _da_n, auto&& _da_q, auto&& _da_fn) {{ (void)_da_q; for (size_t _da_i = 0; _da_i < _da_n; ++_da_i) _da_fn(_da_i); }})({args[0]}, {args[1]}, {lam})"
                      elif func in ("dispatch_sync", "dispatch_async", "dispatch_barrier_sync", "dispatch_barrier_async") and len(args) == 2:
                          rep = f"([&](auto&& _ds_q, auto&& _ds_fn) {{ (void)_ds_q; _ds_fn(); }})({args[0]}, {lam})"
                      elif func == "dispatch_group_async" and len(args) == 3:
                          rep = f"([&](auto&& _dg_g, auto&& _dg_q, auto&& _dg_fn) {{ (void)_dg_g; (void)_dg_q; _dg_fn(); }})({args[0]}, {args[1]}, {lam})"
                      elif func == "dispatch_once" and len(args) == 2:
                          rep = f"([&](auto* _do_p, auto&& _do_fn) {{ if (!*_do_p) {{ *_do_p = 1; _do_fn(); }} }})({args[0]}, {lam})"
                      else:
                          pos = m.end()
                          continue

                      s = s[:m.start()] + rep + s[end_paren + 1:]
                      pos = m.start() + len(rep)
                  else:
                      pos = m.end()
              return s

          for ext in ("*.cpp", "*.cc", "*.cxx", "*.mm", "*.hpp", "*.h"):
              for path in glob.glob(f"ld64/**/{ext}", recursive=True):
                  orig = open(path, encoding="utf-8", errors="ignore").read()
                  patched = patch_gcd(orig)
                  if patched != orig:
                      open(path, "w", encoding="utf-8").write(patched)
          EOF
          CC=clang-12 CXX=clang++-12 ./configure --prefix=/usr/local --target=arm-apple-darwin11 --with-libtapi=/usr/local
          make -j$(nproc)
          make install

          rm -rf /tmp/toolchain-build

      - name: Setup Theos and iOS 9.3 SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS9.3.sdk $HOME/theos/sdks/
          rm -rf /tmp/sdks

          mkdir -p $HOME/theos/toolchain/linux/iphone/bin
          ln -sf /usr/bin/clang $HOME/theos/toolchain/linux/iphone/bin/clang
          ln -sf /usr/bin/clang++ $HOME/theos/toolchain/linux/iphone/bin/clang++
          ln -sf /usr/bin/clang $HOME/theos/toolchain/linux/iphone/bin/arm-apple-darwin11-clang
          ln -sf /usr/bin/clang++ $HOME/theos/toolchain/linux/iphone/bin/arm-apple-darwin11-clang++
          for tool in /usr/local/bin/arm-apple-darwin11-*; do
            ln -sf "$tool" "$HOME/theos/toolchain/linux/iphone/bin/$(basename "$tool")"
          done
          ln -sf /usr/local/bin/ldid $HOME/theos/toolchain/linux/iphone/bin/ldid

      - name: Compile and Package IPA (armv7)
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="/usr/local/bin:$THEOS/bin:$PATH"

          make clean || true
          make FINALPACKAGE=1 stage

          rm -rf Payload ArabicOffice-iOS9-armv7.ipa
          mkdir -p Payload

          if [ -d ".theos/_/Applications/ArabicOffice.app" ]; then
            cp -r ".theos/_/Applications/ArabicOffice.app" Payload/
          elif [ -d ".theos/obj/armv7/ArabicOffice.app" ]; then
            cp -r ".theos/obj/armv7/ArabicOffice.app" Payload/
          else
            APP_PATH=$(find .theos -maxdepth 5 -name "ArabicOffice.app" | head -n 1)
            cp -r "$APP_PATH" Payload/
          fi

          ldid -S Payload/ArabicOffice.app/ArabicOffice
          zip -qry ArabicOffice-iOS9-armv7.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArabicOffice-iOS9-armv7
          path: ArabicOffice-iOS9-armv7.ipa
