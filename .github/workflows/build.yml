name: Build ArabicOffice IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates clang g++ cmake python3 llvm-dev uuid-dev libssl-dev libplist-dev zlib1g-dev libxml2-dev libblocksruntime-dev git make autoconf automake libtool pkg-config zip unzip curl perl fakeroot rsync

      - name: Build ldid, xar, libdispatch, libtapi, and cctools (armv7)
        run: |
          cp -f /usr/include/BlocksRuntime/*.h /usr/local/include/ 2>/dev/null || true

          git clone --depth=1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid -j$(nproc)
          make -C /tmp/ldid install

          git clone --depth=1 https://github.com/tpoechtrager/xar.git /tmp/xar
          cd /tmp/xar
          [ -d xar ] && cd xar
          if [ -f autogen.sh ]; then
            NOCONFIGURE=1 ./autogen.sh || autoreconf -fi
          else
            autoreconf -fi
          fi
          CC=clang CFLAGS="-Wno-error" ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          ldconfig

          git clone --depth=1 https://github.com/tpoechtrager/apple-libdispatch.git /tmp/apple-libdispatch
          mkdir -p /tmp/apple-libdispatch/build
          cd /tmp/apple-libdispatch/build
          CC=clang CXX=clang++ cmake .. \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_C_FLAGS="-Wno-error -fblocks -I/usr/local/include" \
            -DCMAKE_CXX_FLAGS="-Wno-error -fblocks -I/usr/local/include" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L/usr/local/lib -lBlocksRuntime"
          make -j$(nproc)
          make install
          ldconfig

          git clone --depth=1 https://github.com/tpoechtrager/apple-libtapi.git /tmp/apple-libtapi
          cd /tmp/apple-libtapi
          INSTALLPREFIX=/usr/local ./build.sh
          ./install.sh
          ldconfig

          git clone --depth=1 https://github.com/tpoechtrager/cctools-port.git /tmp/cctools
          cd /tmp/cctools/cctools
          CC=clang CXX=clang++ \
            CPPFLAGS="-I/usr/local/include" \
            CFLAGS="-Wno-error -std=gnu17 -I/usr/local/include" \
            CXXFLAGS="-Wno-error -std=gnu++14 -I/usr/local/include" \
            LDFLAGS="-L/usr/local/lib" \
            ./configure --prefix=/usr/local --target=arm-apple-darwin11 --with-libtapi=/usr/local --disable-lto-support
          make -j$(nproc)
          make install

      - name: Setup Theos and iOS 9.3 SDK
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf "$HOME/theos/include/_fallback/sys"
          BIN_DIR="$HOME/theos/toolchain/linux/iphone/bin"
          mkdir -p "$BIN_DIR"

          cat << 'EOF' > "$BIN_DIR/clang"
          #!/bin/bash
          ARGS=()
          SKIP_NEXT=0
          IS_COMPILE_ONLY=0
          for arg in "$@"; do
            if [ $SKIP_NEXT -eq 1 ]; then
              SKIP_NEXT=0
              continue
            fi
            if [ "$arg" = "-arch" ] || [ "$arg" = "-target" ] || [ "$arg" = "--target" ]; then
              SKIP_NEXT=1
              continue
            fi
            if [[ "$arg" == --target=* ]] || [ "$arg" = "-m64" ] || [ "$arg" = "-m32" ] || [[ "$arg" == -march=* ]] || [[ "$arg" == -mcpu=* ]] || [[ "$arg" == -mtune=* ]] || [ "$arg" = "-fmodules" ] || [ "$arg" = "-fcxx-modules" ] || [ "$arg" = "-fimplicit-module-maps" ] || [[ "$arg" == -fmodules-cache-path=* ]]; then
              continue
            fi
            if [ "$arg" = "-c" ] || [ "$arg" = "-S" ] || [ "$arg" = "-E" ]; then
              IS_COMPILE_ONLY=1
            fi
            if [[ "$arg" == -I*/_fallback ]]; then
              ARGS+=("-idirafter${arg#-I}")
              continue
            fi
            ARGS+=("$arg")
          done
          if [ $IS_COMPILE_ONLY -eq 0 ]; then
            ARGS+=("--ld-path=/usr/local/bin/arm-apple-darwin11-ld")
          fi
          exec /usr/bin/clang "${ARGS[@]}" -fno-modules --target=armv7-apple-ios9.0
          EOF
          chmod +x "$BIN_DIR/clang"
          cp "$BIN_DIR/clang" "$BIN_DIR/arm-apple-darwin11-clang"

          cat << 'EOF' > "$BIN_DIR/clang++"
          #!/bin/bash
          ARGS=()
          SKIP_NEXT=0
          IS_COMPILE_ONLY=0
          for arg in "$@"; do
            if [ $SKIP_NEXT -eq 1 ]; then
              SKIP_NEXT=0
              continue
            fi
            if [ "$arg" = "-arch" ] || [ "$arg" = "-target" ] || [ "$arg" = "--target" ]; then
              SKIP_NEXT=1
              continue
            fi
            if [[ "$arg" == --target=* ]] || [ "$arg" = "-m64" ] || [ "$arg" = "-m32" ] || [[ "$arg" == -march=* ]] || [[ "$arg" == -mcpu=* ]] || [[ "$arg" == -mtune=* ]] || [ "$arg" = "-fmodules" ] || [ "$arg" = "-fcxx-modules" ] || [ "$arg" = "-fimplicit-module-maps" ] || [[ "$arg" == -fmodules-cache-path=* ]]; then
              continue
            fi
            if [ "$arg" = "-c" ] || [ "$arg" = "-S" ] || [ "$arg" = "-E" ]; then
              IS_COMPILE_ONLY=1
            fi
            if [[ "$arg" == -I*/_fallback ]]; then
              ARGS+=("-idirafter${arg#-I}")
              continue
            fi
            ARGS+=("$arg")
          done
          if [ $IS_COMPILE_ONLY -eq 0 ]; then
            ARGS+=("--ld-path=/usr/local/bin/arm-apple-darwin11-ld")
          fi
          exec /usr/bin/clang++ "${ARGS[@]}" -fno-modules --target=armv7-apple-ios9.0
          EOF
          chmod +x "$BIN_DIR/clang++"
          cp "$BIN_DIR/clang++" "$BIN_DIR/arm-apple-darwin11-clang++"

          ln -sf /usr/local/bin/arm-apple-darwin11-* "$BIN_DIR/"
          ln -sf /usr/local/bin/arm-apple-darwin11-ld "$BIN_DIR/ld64"
          ln -sf /usr/local/bin/arm-apple-darwin11-ld "$BIN_DIR/ld"
          ln -sf /usr/local/bin/arm-apple-darwin11-as "$BIN_DIR/as"
          ln -sf /usr/local/bin/arm-apple-darwin11-strip "$BIN_DIR/strip"
          ln -sf /usr/local/bin/arm-apple-darwin11-ar "$BIN_DIR/ar"
          ln -sf /usr/local/bin/arm-apple-darwin11-ranlib "$BIN_DIR/ranlib"
          ln -sf /usr/local/bin/arm-apple-darwin11-lipo "$BIN_DIR/lipo"
          ln -sf /usr/local/bin/arm-apple-darwin11-install_name_tool "$BIN_DIR/install_name_tool"
          ln -sf /usr/local/bin/arm-apple-darwin11-codesign_allocate "$BIN_DIR/codesign_allocate"
          ln -sf $(which ldid) "$BIN_DIR/ldid"

          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS9.3.sdk $HOME/theos/sdks/

          echo "void __dummy_rt(void) {}" > /tmp/dummy.c
          /usr/bin/clang --target=armv7-apple-ios9.0 -isysroot $HOME/theos/sdks/iPhoneOS9.3.sdk -c /tmp/dummy.c -o /tmp/dummy.o
          CLANG_RES_DIR=$(/usr/bin/clang -print-resource-dir)
          mkdir -p "$CLANG_RES_DIR/lib/darwin"
          /usr/local/bin/arm-apple-darwin11-ar rcs "$CLANG_RES_DIR/lib/darwin/libclang_rt.ios.a" /tmp/dummy.o
          cp "$CLANG_RES_DIR/lib/darwin/libclang_rt.ios.a" "$CLANG_RES_DIR/lib/darwin/libclang_rt.ios_armv7.a"

      - name: Compile and Package IPA (armv7)
        run: |
          export THEOS=$HOME/theos
          export PATH="$HOME/theos/toolchain/linux/iphone/bin:/usr/local/bin:$PATH"
          find . -maxdepth 2 -name "*.m" -exec sed -i 's/@import \([A-Za-z0-9_]*\);/#import <\1\/\1.h>/g' {} +
          make stage DEBUG=0 \
            TARGET_CC="$HOME/theos/toolchain/linux/iphone/bin/clang" \
            TARGET_CXX="$HOME/theos/toolchain/linux/iphone/bin/clang++" \
            TARGET_LD="$HOME/theos/toolchain/linux/iphone/bin/clang++" \
            TARGET_STRIP="/usr/local/bin/arm-apple-darwin11-strip"
          mkdir -p build/Payload
          cp -r .theos/_/Applications/*.app build/Payload/
          cd build && zip -r ../ArabicOffice-iOS9-armv7.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArabicOffice-iOS9-armv7
          path: ArabicOffice-iOS9-armv7.ipa
